<div class="modal fade" id="addToPlaylistModal" tabindex="-1" aria-labelledby="addToPlaylistModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addToPlaylistModalLabel">Add to Playlist</h5>
<button type="button" class="btn-close modal-close-btn" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted mb-3">Select one or more playlists to add this stream to.</p>
                <div id="add-playlist-error" class="text-danger small mb-2" style="display:none;">Please select at least one playlist!</div>
                <table class="table table-html-hover">
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" class="form-check-input" id="select-all-playlists"></th>
<th>Playlists</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if playlists is defined and queueStream is defined %}
                            {% for playlist in playlists %}
                                <tr>
                                    <td><input type="checkbox" class="form-check-input playlist-checkbox" value="{{ playlist.id }}"></td>
                                    <td class="align-middle">{{ playlist.name }}</td>
                                </tr>
                            {% endfor %}
                        {% endif %}
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
<button type="button" class="btn btn-secondary modal-close-btn" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirm-add-playlists" data-queue-stream-id="{{ queueStream.id if queueStream is defined else '' }}">Confirm</button>
            </div>
        </div>
    </div>
</div>
